name: Continuous Deployment to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: geosurvey-backend
  REGION: europe-west1
  IMAGE_NAME: europe-west1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/cloud-run-source-deploy/geosurvey-backend

jobs:
  deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository exists
        run: |
          if ! gcloud artifacts repositories describe cloud-run-source-deploy --location="${REGION}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud artifacts repositories create cloud-run-source-deploy \
              --repository-format=docker \
              --location="${REGION}" \
              --project="${PROJECT_ID}" \
              --description="Docker images for Cloud Run deployments"
          fi

      - name: Authorize Docker to push to Google Artifact Registry
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          docker build -t ${IMAGE_NAME}:${{ github.sha }} -t ${IMAGE_NAME}:latest .
          docker push ${IMAGE_NAME}:${{ github.sha }}
          docker push ${IMAGE_NAME}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: >-
            --port=8080
            --allow-unauthenticated
            --min-instances=0
            --max-instances=10
            --cpu=1
            --memory=512Mi
            --ingress=all
          env_vars: |-
            MISTRAL_API_KEY=${{ secrets.MISTRAL_API_KEY }}
            FIREBASE_WEB_API_KEY=${{ secrets.FIREBASE_WEB_API_KEY }}
            AI_INTERPRETATION_PROVIDER=mistral
            AI_INTERPRETATION_ALLOW_ANONYMOUS=true

      - name: Ensure GroundSurf custom domain mapping
        shell: bash
        run: |
          if ! gcloud --quiet beta run domain-mappings describe --domain="groundsurf.net" --region="${REGION}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud --quiet beta run domain-mappings create \
              --service="${SERVICE_NAME}" \
              --domain="groundsurf.net" \
              --region="${REGION}" \
              --project="${PROJECT_ID}" || echo "GroundSurf domain mapping could not be created yet; deployment itself remains valid."
          fi
          gcloud --quiet beta run domain-mappings describe \
            --domain="groundsurf.net" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --format='yaml(status.resourceRecords,status.certificateStatus,status.conditions)' || true

          if ! gcloud --quiet beta run domain-mappings describe --domain="www.groundsurf.net" --region="${REGION}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud --quiet beta run domain-mappings create \
              --service="${SERVICE_NAME}" \
              --domain="www.groundsurf.net" \
              --region="${REGION}" \
              --project="${PROJECT_ID}" || echo "GroundSurf www domain mapping could not be created yet; deployment itself remains valid."
          fi

          for DOMAIN in groundsurf.net www.groundsurf.net; do
            RECORDS_JSON="$(gcloud --quiet beta run domain-mappings describe --domain="${DOMAIN}" --region="${REGION}" --project="${PROJECT_ID}" --format='json(status.resourceRecords)' 2>/dev/null || true)"
            if [ -z "${RECORDS_JSON}" ]; then
              echo "No DNS records available yet for ${DOMAIN}."
              continue
            fi
            echo "Applying Cloud Run DNS records for ${DOMAIN} to Cloud DNS zone groundsurf-net."
            echo "${RECORDS_JSON}" | jq -c '.status.resourceRecords // [] | group_by(.name, .type)[] | {name: .[0].name, type: .[0].type, rrdatas: map(.rrdata)}' | while read -r RECORD; do
              NAME="$(echo "${RECORD}" | jq -r '.name')"
              TYPE="$(echo "${RECORD}" | jq -r '.type')"
              RRDATAS="$(echo "${RECORD}" | jq -r '.rrdatas | join(",")')"
              if [ -z "${RRDATAS}" ] || [ "${RRDATAS}" = "null" ]; then continue; fi
              EXISTING="$(gcloud dns record-sets list --zone="groundsurf-net" --project="${PROJECT_ID}" --name="${NAME}" --type="${TYPE}" --format='value(name)' 2>/dev/null || true)"
              if [ -n "${EXISTING}" ]; then
                gcloud dns record-sets update "${NAME}" --zone="groundsurf-net" --project="${PROJECT_ID}" --type="${TYPE}" --ttl=300 --rrdatas="${RRDATAS}"
              else
                gcloud dns record-sets create "${NAME}" --zone="groundsurf-net" --project="${PROJECT_ID}" --type="${TYPE}" --ttl=300 --rrdatas="${RRDATAS}"
              fi
            done
          done

      # Deploy runtime secrets for AI and Firebase authentication.
      - name: Show Cloud Run service URL
        shell: bash
        run: |
          echo "Cloud Run service URL: $(gcloud run services describe "${SERVICE_NAME}" --region="${REGION}" --project="${PROJECT_ID}" --format='value(status.url)')"
